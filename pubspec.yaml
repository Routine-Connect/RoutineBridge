name: routine_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1


environment:
  sdk: ^3.11.3


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  permission_handler: ^12.0.2
  intl: ^0.20.2
  vibration: ^3.1.8
  flutter_slidable: ^4.0.3
  phosphor_flutter: ^2.1.0
  fl_chart: ^1.2.0
  video_player: ^2.11.1
  flutter_native_splash: ^2.4.7
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  android: false
  ios: true
  web: false

  color: "#F8EFD3"