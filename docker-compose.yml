version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: doday-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: doday
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - doday-network

  spring:
    build: .
    container_name: doday-spring
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/doday?serverTimezone=UTC&useSSL=false&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
    depends_on:
      - mysql
    networks:
      - doday-network

volumes:
  mysql-data:

networks:
  doday-network:
    driver: bridge